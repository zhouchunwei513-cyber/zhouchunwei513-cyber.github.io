<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>访问统计后台</title>
  <style>
    :root {
      --bg: #0a0e17;
      --card: rgba(20, 27, 45, 0.85);
      --border: rgba(120, 140, 200, 0.15);
      --text: #e6ecff;
      --muted: #93a0c4;
      --accent-1: #22d3ee;
      --accent-2: #a78bfa;
      --danger: #f87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: -1;
      background-image:
        linear-gradient(rgba(120,140,200,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,140,200,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }
    h1 { font-size: 1.6rem; margin-bottom: 20px; }
    h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--accent-1); }
    .gradient-text {
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
    .stat {
      background: rgba(34,211,238,0.06);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }
    .stat .num { font-size: 2rem; font-weight: 700; color: var(--accent-1); }
    .stat .label { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(10,14,23,0.8);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 14px;
    }
    input:focus { outline: none; border-color: var(--accent-1); }
    button {
      padding: 12px 28px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      color: #0a0e17;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; white-space: nowrap; }
    td { word-break: break-all; }
    .msg { margin-top: 12px; font-size: 0.9rem; color: var(--danger); min-height: 1.2em; }
    .msg.ok { color: #4ade80; }
    .hidden { display: none; }
    .logout { float: right; }
    .table-wrap { overflow-x: auto; }
    .tag-badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 0.78rem; border: 1px solid rgba(34,211,238,0.35);
      color: var(--accent-1); margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="container">
    <div id="loginView" class="card">
      <h1><span class="gradient-text">后台登录</span></h1>
      <form id="loginForm">
        <input type="text" id="loginUser" placeholder="用户名" autocomplete="username" />
        <input type="password" id="loginPass" placeholder="密码" autocomplete="current-password" />
        <button type="submit">登录</button>
        <div class="msg" id="loginMsg"></div>
      </form>
    </div>

    <div id="adminView" class="hidden">
      <div class="card">
        <button class="secondary logout" onclick="logout()">退出登录</button>
        <h1>访问统计 <span id="adminUser"></span></h1>
        <div class="stats-grid">
          <div class="stat"><div class="num" id="statTotal">-</div><div class="label">累计访问量</div></div>
          <div class="stat"><div class="num" id="statToday">-</div><div class="label">今日访问量</div></div>
          <div class="stat"><div class="num" id="statTodayIp">-</div><div class="label">今日独立 IP</div></div>
        </div>
      </div>

      <div class="card">
        <h2>最近访问</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>时间</th><th>IP 地址</th><th>地域</th><th>路径</th><th>UA</th></tr>
            </thead>
            <tbody id="visitRows"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>每日统计</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>日期</th><th>访问量</th><th>独立 IP</th></tr>
            </thead>
            <tbody id="dailyRows"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>修改密码</h2>
        <form id="pwdForm">
          <input type="password" id="oldPwd" placeholder="旧密码" autocomplete="current-password" />
          <input type="password" id="newPwd" placeholder="新密码（至少 6 位）" autocomplete="new-password" />
          <input type="password" id="newPwd2" placeholder="确认新密码" autocomplete="new-password" />
          <button type="submit">修改密码</button>
          <div class="msg" id="pwdMsg"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API = "https://visit-tracker.visit-tracker.workers.dev";
    const tokenKey = "visit_admin_token";

    const $ = (id) => document.getElementById(id);

    function showMsg(el, text, ok) {
      el.textContent = text;
      el.className = "msg" + (ok ? " ok" : "");
      setTimeout(() => { el.textContent = ""; }, 3000);
    }

    function logout() {
      localStorage.removeItem(tokenKey);
      location.reload();
    }

    async function login(username, password) {
      const res = await fetch(API + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "登录失败");
      localStorage.setItem(tokenKey, data.token);
      return data.token;
    }

    async function loadStats(token) {
      const res = await fetch(API + "/api/stats?token=" + encodeURIComponent(token));
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "加载失败");
      $("statTotal").textContent = data.total;
      $("statToday").textContent = data.today.count;
      $("statTodayIp").textContent = data.today.uniqueIps;

      const vr = $("visitRows");
      vr.innerHTML = "";
      if (data.recent.length === 0) {
        vr.innerHTML = '<tr><td colspan="5" style="color:var(--muted)">暂无访问记录</td></tr>';
      }
      data.recent.forEach((v) => {
        const tr = document.createElement("tr");
        const loc = [v.country, v.province, v.city].filter(Boolean).join(" · ") || "-";
        const time = new Date(v.time).toLocaleString("zh-CN", { hour12: false });
        tr.innerHTML =
          "<td>" + time + "</td>" +
          "<td>" + v.ip + "</td>" +
          "<td>" + loc + "</td>" +
          "<td>" + v.path + "</td>" +
          "<td style='max-width:220px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap'>" + (v.ua || "-") + "</td>";
        vr.appendChild(tr);
      });

      const dr = $("dailyRows");
      dr.innerHTML = "";
      if (data.daily.length === 0) {
        dr.innerHTML = '<tr><td colspan="3" style="color:var(--muted)">暂无数据</td></tr>';
      }
      data.daily.forEach((d) => {
        const tr = document.createElement("tr");
        tr.innerHTML = "<td>" + d.date + "</td><td>" + d.count + "</td><td>" + d.uniqueIps + "</td>";
        dr.appendChild(tr);
      });
    }

    async function changePassword(token, oldPwd, newPwd) {
      const res = await fetch(API + "/api/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, oldPassword: oldPwd, newPassword: newPwd }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "修改失败");
      return data;
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("loginMsg");
      try {
        const token = await login($("loginUser").value.trim(), $("loginPass").value);
        $("loginView").classList.add("hidden");
        $("adminView").classList.remove("hidden");
        $("adminUser").textContent = $("loginUser").value.trim();
        await loadStats(token);
      } catch (err) {
        showMsg(msg, err.message);
      }
    });

    document.getElementById("pwdForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("pwdMsg");
      const newPwd = $("newPwd").value;
      if (newPwd !== $("newPwd2").value) { showMsg(msg, "两次输入的新密码不一致"); return; }
      try {
        const token = localStorage.getItem(tokenKey);
        await changePassword(token, $("oldPwd").value, newPwd);
        $("oldPwd").value = ""; $("newPwd").value = ""; $("newPwd2").value = "";
        showMsg(msg, "密码修改成功", true);
      } catch (err) {
        showMsg(msg, err.message);
      }
    });

    (async function init() {
      const token = localStorage.getItem(tokenKey);
      if (!token) return;
      try {
        await loadStats(token);
        $("loginView").classList.add("hidden");
        $("adminView").classList.remove("hidden");
        const user = localStorage.getItem("visit_admin_user") || "管理员";
        $("adminUser").textContent = user;
      } catch (err) {
        localStorage.removeItem(tokenKey);
      }
    })();
  </script>
</body>
</html>
